<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Eyes Only</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: one phone-width column, the game's own situation room, played as a short reel that builds the screen
   piece by piece; a single dark world by choice. */
:root {
  color-scheme: dark;
  --wall: #0b0e11;
  --panel: #151a20;
  --line: #29313a;
  --ink: #e8e3d8;
  --muted: #9aa3ad;
  --paper: #efe6cf;
  --paper-ink: #2b2519;
  --secret: #d9473b;
  --alert: #e3a73f;
  --news: #b8c7d6;
  --type: "Courier Prime", "Courier New", Courier, ui-monospace, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--wall);
  color: var(--ink);
  font: 400 1rem/1.5 var(--sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--alert); outline-offset: 3px; }
.stage { max-width: 30rem; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 1rem; padding-block: 1rem 4.5rem; }

/* the gate */
.gate { flex: 1; display: grid; place-content: center; gap: 1.6rem; text-align: center; }
.gate .seal { font: 700 0.8rem/1 var(--type); letter-spacing: 0.3em; color: var(--secret); }
.gate h1 { font: 700 clamp(2.4rem, 12vw, 3.6rem)/1 var(--type); margin: 0; letter-spacing: 0.04em; }
.gate p { color: var(--muted); margin: 0; }
.go {
  justify-self: center;
  border: 2px solid var(--secret);
  background: transparent;
  padding: 0.85rem 1.4rem;
  font: 700 0.95rem/1 var(--type);
  letter-spacing: 0.18em;
  text-transform: uppercase;
  border-radius: 3px;
}
.go:hover { background: rgb(217 71 59 / 0.12); }

/* the screen as it builds */
.bar { display: flex; justify-content: space-between; align-items: baseline; gap: 0.75rem; border-bottom: 1px solid var(--line); padding-bottom: 0.6rem; font: 700 0.78rem/1.2 var(--type); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.bar .me { color: var(--ink); }
.sync { font: 400 0.9rem/1.5 var(--type); color: var(--muted); min-height: 1.4em; margin: 0; }
.typed { font: 400 1.35rem/1.4 var(--type); margin: 0; min-height: 1.4em; }
.clock { font: 700 2.6rem/1 var(--type); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; display: flex; align-items: baseline; gap: 0.6rem; }
.clock small { font: 700 0.72rem/1 var(--type); letter-spacing: 0.16em; color: var(--muted); text-transform: uppercase; }
.clock.low { color: var(--alert); }

.paper { background: var(--paper); color: var(--paper-ink); border-radius: 3px; padding: 1rem 1rem 1.1rem; position: relative; box-shadow: 0 12px 30px rgb(0 0 0 / 0.4); }
.paper .head { font: 700 0.72rem/1 var(--type); letter-spacing: 0.16em; text-transform: uppercase; color: #6b5e43; margin-bottom: 0.6rem; }
.paper .body { font: 400 1.02rem/1.5 var(--type); margin: 0; min-height: 3em; }
.stage > * { scroll-margin-bottom: 4.5rem; }
.paper:has(.stamp) { margin-top: 0.8rem; }
.stamp { position: absolute; top: -0.9rem; right: 0.7rem; background: var(--paper); font: 700 0.85rem/1 var(--type); letter-spacing: 0.16em; color: var(--secret); border: 2px solid var(--secret); padding: 0.3rem 0.45rem; transform: rotate(-6deg); }

.msg { border: 1px solid var(--line); background: var(--panel); border-radius: 10px 10px 10px 2px; padding: 0.7rem 0.85rem; display: grid; gap: 0.35rem; max-width: 92%; }
.tag { font: 700 0.68rem/1 var(--type); letter-spacing: 0.14em; text-transform: uppercase; color: var(--secret); }
.msg p { margin: 0; }

.wallstrip { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 0.6rem; display: grid; gap: 0.45rem; }
.wallstrip .tag { color: var(--news); }
.wallstrip p { margin: 0; font: 400 0.98rem/1.4 var(--type); color: var(--news); }
.wallstrip b { color: var(--ink); }

/* the curtain */
.curtain { display: grid; gap: 0.9rem; }
.curtain h2 { font: 700 1.1rem/1.2 var(--type); letter-spacing: 0.14em; text-transform: uppercase; margin: 0; color: var(--alert); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; border-top: 1px solid var(--line); padding-top: 0.7rem; }
.pair > div { display: grid; gap: 0.3rem; align-content: start; }
.pair .who { grid-column: 1 / -1; font: 700 0.8rem/1 var(--type); letter-spacing: 0.14em; text-transform: uppercase; }
.pair .said { color: var(--news); font-size: 0.92rem; }
.pair .meant { color: var(--ink); font-size: 0.92rem; }
.pair .tag.pub { color: var(--news); }

/* the title */
.title { flex: 1; display: grid; align-content: center; gap: 1.1rem; text-align: center; }
.title .kicker { font: 700 0.8rem/1 var(--type); letter-spacing: 0.3em; color: var(--secret); text-transform: uppercase; }
.title h1 { font: 700 clamp(2.3rem, 11vw, 3.4rem)/1 var(--type); margin: 0; letter-spacing: 0.05em; }
.title .sub { font: 400 1.2rem/1.4 var(--type); color: var(--alert); margin: 0; }
.title ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 0.5rem; color: var(--muted); }
.title ul b { color: var(--ink); font-weight: 600; }

.choices { display: grid; gap: 0.6rem; }
.choices button { border: 1px solid var(--line); background: var(--panel); border-radius: 4px; padding: 0.9rem 1rem; text-align: left; display: grid; gap: 0.15rem; }
.choices button:hover { border-color: var(--alert); }
.choices b { font: 700 1rem/1.2 var(--type); }
.choices span { color: var(--muted); font-size: 0.88rem; }
.answer { font: 400 1.15rem/1.45 var(--type); margin: 0; min-height: 1.4em; color: var(--alert); }
.again { align-self: flex-end; background: none; border: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; padding: 0.5rem; }

.in { animation: rise 0.45s ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.thud { animation: thud 0.32s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes thud { from { opacity: 0; transform: rotate(-6deg) scale(2.4); } }
.lift { animation: lift 1.1s ease-in-out both; }
@keyframes lift { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

.sound {
  position: fixed;
  left: max(12px, env(safe-area-inset-left, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 0.45rem 0.8rem;
  font: 700 0.72rem/1 var(--type);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
}
@media (prefers-reduced-motion: reduce) {
  .in, .thud, .lift { animation: none; }
}
</style>
</head>
<body>
<div class="stage" id="stage" aria-live="polite"></div>
<button type="button" class="sound" id="sound" aria-pressed="false">Tap for sound</button>

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"};

const stage = document.getElementById('stage');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Sound: made on the spot, no files except the computer's voice ---------- */
let ac = null, out = null, noiseBuf = null, muted = false, media = null;
function audio() {
  try {
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
      ac = new C();
      ac.onstatechange = syncSound;
      const comp = ac.createDynamicsCompressor();
      out = ac.createGain(); out.gain.value = muted ? 0 : 0.9;
      out.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state !== 'running') {
      const p = ac.resume();
      if (p) p.then(syncSound, () => {});
      const s = ac.createBufferSource();
      s.buffer = ac.createBuffer(1, 1, 22050);
      s.connect(ac.destination); s.start(0);
    }
  } catch { return null; }
  keepMedia();
  loadVoice();
  syncSound();
  return ac;
}
/* A silent track played as media, so an iPhone on silent still plays the page's sound. */
function keepMedia() {
  try {
    if (!media) {
      const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      w(36, 'data'); v.setUint32(40, n * 2, true);
      media = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
      media.loop = true;
      media.setAttribute('playsinline', '');
    }
    if (media.paused) { const p = media.play(); if (p) p.catch(() => {}); }
  } catch {}
}
const live = () => ac && ac.state === 'running' && !muted;
function env(g, t, a, peak, hold, rel) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + a + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
}
function noise(t, dur) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t); s.stop(t + dur); return s; }
function tone(type, f, t, dur) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur); return o; }
function chain(...nodes) { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); return nodes[0]; }
function filter(type, f, q = 1) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function gain() { return ac.createGain(); }

/* A secure phone going secure: ring-back, then two tones trading places, then a burst of key-exchange hiss. */
function goSecure() {
  if (!live()) return;
  const t0 = ac.currentTime + 0.05, g = gain();
  g.gain.value = 0.18; chain(g, out);
  for (let i = 0; i < 2; i++) {
    const s = t0 + i * 0.7, gg = gain(); env(gg, s, 0.01, 0.6, 0.35, 0.05);
    const a = tone('sine', 440, s, 0.45), b = tone('sine', 480, s, 0.45); a.connect(gg); b.connect(gg); gg.connect(g);
  }
  const o = tone('square', 900, t0 + 1.5, 1.6), fg = gain();
  for (let k = 0; k < 32; k++) o.frequency.setValueAtTime(k % 2 ? 1500 : 900, t0 + 1.5 + k * 0.05);
  fg.gain.value = 0.3; chain(o, filter('bandpass', 1200, 0.9), fg, g);
  const ng = gain(); env(ng, t0 + 2.9, 0.02, 0.5, 0.35, 0.2); chain(noise(t0 + 2.9, 0.7), filter('bandpass', 2400, 0.6), ng, g);
}
function key() {
  if (!live()) return;
  const t = ac.currentTime, g = gain();
  env(g, t, 0.001, 0.09, 0.003, 0.025);
  chain(noise(t, 0.035), filter('bandpass', 1300 + Math.random() * 700, 6), g, out);
}
function stampSound() {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), o = tone('sine', 140, t, 0.4);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.25);
  env(g, t, 0.003, 0.4, 0.03, 0.25);
  chain(o, g, out);
  const ng = gain(); env(ng, t, 0.001, 0.25, 0.01, 0.08); chain(noise(t, 0.12), filter('lowpass', 1800), ng, out);
}
function bell(f = 1320) {
  if (!live()) return;
  const t = ac.currentTime, g = gain();
  env(g, t, 0.004, 0.12, 0.02, 1.0);
  chain(tone('sine', f, t, 1.2), g, out);
  const g2 = gain(); env(g2, t, 0.004, 0.04, 0.02, 0.5); chain(tone('sine', f * 2.76, t, 0.7), g2, out);
}
function pop() {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), o = tone('sine', 520, t, 0.25);
  o.frequency.exponentialRampToValueAtTime(980, t + 0.12);
  env(g, t, 0.005, 0.08, 0.05, 0.12);
  chain(o, g, out);
}
function tickTock(hi) {
  if (!live()) return;
  const t = ac.currentTime, g = gain();
  env(g, t, 0.001, 0.07, 0.01, 0.04);
  chain(tone('square', hi ? 1900 : 1500, t, 0.08), filter('bandpass', 1700, 4), g, out);
}
function whoosh(d = 1.6) {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), bp = filter('bandpass', 250, 1.4);
  bp.frequency.exponentialRampToValueAtTime(3200, t + d * 0.7);
  env(g, t, d * 0.6, 0.28, 0.05, d * 0.4);
  chain(noise(t, d + 0.2), bp, g, out);
}
function swell() {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), lp = filter('lowpass', 500);
  lp.frequency.linearRampToValueAtTime(2200, t + 3);
  env(g, t, 1.6, 0.24, 2.4, 3);
  chain(lp, g, out);
  for (const f of [65.41, 130.81, 196, 261.63, 392, 523.25]) {
    for (const dt of [-1.5, 1.5]) { const o = tone(f < 100 ? 'sawtooth' : 'triangle', f, t, 8); o.detune.value = dt * 4; o.connect(lp); }
  }
}

const voiceBufs = {};
let voiceLoading = null;
function loadVoice() {
  if (voiceLoading || !ac) return voiceLoading;
  voiceLoading = Promise.all(Object.entries(VOICE).map(async ([k, b64]) => {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    try { voiceBufs[k] = await new Promise((res, rej) => ac.decodeAudioData(bytes.buffer, res, rej)); } catch {}
  }));
  return voiceLoading;
}
/* The voice: the phone's own natural voice when it has one; otherwise the recorded lines above. */
const LINES = {
  secure: 'Secure line established.',
  minister: 'Welcome, Minister.',
  cable: 'Incoming cable. Eyes only.',
  clock: 'You have twenty minutes.',
  private: 'This conversation is private.',
  everyone: 'Everyone heard that.',
  curtain: 'Now the curtain lifts.',
  country: 'What will your country do?'
};
const synth = window.speechSynthesis;
let phoneVoice = null;
function pickVoice() {
  if (!synth) return;
  const english = synth.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang));
  /* A woman's voice, natural where the phone has one. iPhone: Ava, Samantha, Allison, Susan, Zoe; Android:
     Google US English; Windows and Edge: Aria, Jenny, Zira. Siri's own voices are not offered to web pages. */
  const female = ['ava', 'samantha', 'allison', 'susan', 'zoe', 'nicky', 'karen', 'moira', 'tessa', 'serena', 'aria', 'jenny', 'michelle', 'emma', 'libby', 'sonia', 'google us english', 'female', 'zira'];
  const score = v => {
    const name = v.name.toLowerCase();
    const at = female.findIndex(f => name.includes(f));
    if (at < 0) return -1;
    const rich = /natural|neural|premium|enhanced|online/.test(name) ? 100 : 0;
    const us = /us/i.test(v.lang) ? 10 : 0;
    return rich + us + (female.length - at) / female.length;
  };
  const best = english.map(v => [score(v), v]).filter(([s]) => s >= 0).sort((a, b) => b[0] - a[0])[0];
  phoneVoice = best ? best[1] : null;
}
if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
/* Phones let a page talk only after a tap; one silent word during the tap opens the way. */
function unlockSpeech() {
  try { if (synth) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; synth.speak(u); } } catch {}
}
function speak(k) {
  if (muted) return;
  if (synth && phoneVoice) {
    try {
      const u = new SpeechSynthesisUtterance(LINES[k]);
      u.voice = phoneVoice; u.lang = phoneVoice.lang; u.rate = 1; u.pitch = 1; u.volume = 1;
      synth.speak(u);
      return;
    } catch {}
  }
  if (!live() || !voiceBufs[k]) return;
  const s = ac.createBufferSource(), g = gain();
  s.buffer = voiceBufs[k]; g.gain.value = 1.15;
  chain(s, filter('highpass', 160), g, out);
  s.start(ac.currentTime + 0.02);
}

const soundBtn = document.getElementById('sound');
function syncSound() {
  const on = ac && ac.state === 'running';
  soundBtn.textContent = muted ? 'Sound off' : on ? 'Sound on' : 'Tap for sound';
  soundBtn.setAttribute('aria-pressed', String(!muted && !!on));
}
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (ac && ac.state === 'running') muted = !muted; else muted = false;
  if (muted && synth) synth.cancel();
  if (out) out.gain.value = muted ? 0 : 0.9;
  audio();
});
for (const ev of ['pointerup', 'touchend', 'click']) document.addEventListener(ev, () => audio(), { passive: true });
syncSound();

/* ---------- The reel ---------- */
let run = 0, hurry = false;
class Stopped extends Error {}
const wait = (ms, id) => new Promise((res, rej) => setTimeout(() => (id === run ? res() : rej(new Stopped())), reduce ? Math.min(ms, 900) : ms));
document.addEventListener('pointerdown', e => { if (!e.target.closest('button')) hurry = true; });

function el(tag, cls, html = '') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  e.innerHTML = html;
  return e;
}
function add(node, anim = 'in') {
  if (anim) node.classList.add(anim);
  stage.append(node);
  node.scrollIntoView({ block: 'end', behavior: reduce ? 'auto' : 'smooth' });
  return node;
}
async function type(target, text, id, { ms = 34, sound = key } = {}) {
  hurry = false;
  target.textContent = '';
  for (let i = 0; i < text.length; i++) {
    if (id !== run) throw new Stopped();
    if (hurry) { target.textContent = text; return; }
    target.textContent += text[i];
    if (text[i] !== ' ' && i % 2 === 0) sound();
    await new Promise(r => setTimeout(r, reduce ? 4 : ms));
  }
}

function gate() {
  run++;
  stage.innerHTML = '';
  const g = el('div', 'gate', `
    <span class="seal">Secure line</span>
    <h1>EYES ONLY</h1>
    <p>A cable is waiting for you. About a minute, with sound.</p>
    <button type="button" class="go" id="open">Go secure</button>`);
  stage.append(g);
  g.querySelector('#open').addEventListener('click', () => { unlockSpeech(); reel(); });
}

async function reel() {
  const id = ++run;
  if (synth) synth.cancel();
  audio();
  stage.innerHTML = '';
  try {
    await Promise.race([loadVoice() ?? Promise.resolve(), wait(1500, id)]);

    const bar = add(el('header', 'bar', '<span class="me">Brisa · Minister</span><span>Situation room</span>'));
    const sync = add(el('p', 'sync'));
    goSecure();
    await type(sync, 'Ringing… synchronising… key loaded.', id, { ms: 70, sound: () => {} });
    await wait(900, id);
    speak('secure');
    sync.textContent = 'Secure line established.';
    await wait(1900, id);

    const hello = add(el('p', 'typed'));
    speak('minister');
    await type(hello, 'Welcome, Minister.', id, { ms: 60 });
    await wait(900, id);

    bell();
    speak('cable');
    const cable = add(el('article', 'paper', '<div class="head">Cable · from your embassy in Ardent</div><p class="body"></p>'));
    await wait(1400, id);
    const stamp = el('span', 'stamp thud', 'Eyes only');
    cable.append(stamp);
    stampSound();
    await wait(500, id);
    await type(cable.querySelector('.body'), 'Dawn. Ardent\'s coast guard boarded one of our container ships in the Strait of Velm and held it six hours. Insurers are reviewing cover. The summit opens in two days.', id, { ms: 26 });
    await wait(700, id);

    speak('clock');
    const clock = add(el('div', 'clock', '<span>20:00</span><small>left in turn 1</small>'));
    const face = clock.firstChild;
    let secs = 20 * 60;
    const tickTimer = setInterval(() => {
      if (id !== run) return clearInterval(tickTimer);
      secs -= 7;
      face.textContent = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
      tickTock(secs % 2);
      if (secs < 17 * 60) clock.classList.add('low');
    }, 260);
    await wait(2400, id);

    pop();
    speak('private');
    add(el('div', 'msg', '<span class="tag">Private · Corva to you</span><p>Escort our next tanker. We have twelve days of fuel.</p>'));
    await wait(2300, id);
    pop();
    add(el('div', 'msg', '<span class="tag">Private · Ardent to you</span><p>Register your firms with our desk before the summit, and your ships pass first.</p>'));
    await wait(2600, id);
    clearInterval(tickTimer);

    whoosh(0.8);
    const strip = add(el('section', 'wallstrip', '<span class="tag">On the wall · everyone sees</span>'));
    await wait(500, id);
    for (const [who, line] of [['Corva', 'Friends do not wait to be inspected.'], ['Ardent', 'Ships that comply will pass freely.'], ['Brisa', 'We support free passage, and will consult our partners.']]) {
      const p = el('p', 'in', `<b>${who}:</b> <span></span>`);
      strip.append(p);
      await type(p.querySelector('span'), line, id, { ms: 22, sound: () => tickTock(1) });
      await wait(250, id);
    }
    speak('everyone');
    await wait(2000, id);

    stage.innerHTML = '';
    whoosh(1.4);
    speak('curtain');
    const curtain = add(el('section', 'curtain', `
      <h2>When the game ends, the curtain lifts</h2>
      <p>Every screen shows everything: what each country said in public, and what it wrote home in secret.</p>`), 'lift');
    await wait(1600, id);
    for (const [who, said, meant] of [
      ['Ardent', 'Ships that comply will pass freely.', 'We are testing how many states quietly comply.'],
      ['Corva', 'Friends do not wait to be inspected.', 'If Brisa will not escort us, we turn to Ardent\'s rivals.'],
      ['Brisa', 'We support free passage.', 'Our cabinet is split. Do not commit to anything yet.']
    ]) {
      curtain.append(el('div', 'pair in', `<span class="who">${who}</span>
        <div><span class="tag pub">Said in public</span><span class="said">${said}</span></div>
        <div><span class="tag">Cabled home</span><span class="meant">${meant}</span></div>`));
      pop();
      await wait(1900, id);
    }
    await wait(1200, id);

    stage.innerHTML = '';
    swell();
    add(el('section', 'title', `
      <span class="kicker">The crisis game</span>
      <h1>KRIEGSSPIEL</h1>
      <p class="sub">Coming to the kitchen table.</p>
      <ul>
        <li><b>Five countries.</b> Each phone sees only its own secrets.</li>
        <li><b>One White Cell</b> decides what the world does next.</li>
        <li><b>The AI</b> plays every country no one takes.</li>
      </ul>`));
    await wait(4200, id);

    speak('country');
    const ask = add(el('p', 'typed'));
    await type(ask, 'What will your country do?', id, { ms: 55 });
    const choices = add(el('div', 'choices', `
      <button type="button" data-a="Corva waits for your answer. So does Ardent."><b>Talk privately</b><span>Only the two of you will know.</span></button>
      <button type="button" data-a="Careful. Everyone hears what you say in public."><b>Speak in public</b><span>Every country will hear it.</span></button>
      <button type="button" data-a="Your government is listening. Tell it the truth."><b>Cable home</b><span>Your own account of the turn.</span></button>`));
    const answer = add(el('p', 'answer'), null);
    choices.addEventListener('click', async e => {
      const b = e.target.closest('button');
      if (!b) return;
      bell(990);
      try {
        await type(answer, `${b.dataset.a} Bring this phone to the table, Minister.`, id, { ms: 30 });
      } catch {}
    });
    const again = add(el('button', 'again', 'Play it again'), null);
    again.type = 'button';
    again.addEventListener('click', () => { unlockSpeech(); reel(); });
  } catch (error) {
    if (!(error instanceof Stopped)) throw error;
  }
}

gate();
</script>
