<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hill 142</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-width column that never scrolls during the reel: the clock, the night map (the game's own
   look), and the radio under it. A single dark world by choice. About a minute, then you choose. */
:root {
  color-scheme: dark;
  --wall: #05090d;
  --panel: #0f1820;
  --line: #243240;
  --ink: #e8e3d8;
  --muted: #8f9aa3;
  --alert: #e3a73f;
  --field: #14251f;
  --woods: #0d3122;
  --leaf: #1f5a3d;
  --contour: #c4a86e;
  --water: #2c7da0;
  --water-light: #8ad4ef;
  --road: #a39270;
  --blue: #5bb8ff;
  --red: #ff6a5c;
  --flare: #ffd27a;
  --type: "Courier Prime", "Courier New", Courier, ui-monospace, monospace;
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --serif: Georgia, "Times New Roman", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--wall); color: var(--ink); font: 16px/1.45 var(--sans); }
body { min-height: 100dvh; overflow-x: clip; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--flare); outline-offset: 2px; }

.stage {
  position: relative;
  max-width: 30rem;
  min-height: 100dvh;
  margin-inline: auto;
  padding: max(0.75rem, env(safe-area-inset-top, 0px)) max(1rem, env(safe-area-inset-right, 0px)) max(1rem, env(safe-area-inset-bottom, 0px)) max(1rem, env(safe-area-inset-left, 0px));
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: auto auto 1fr;
  gap: 0.6rem;
}

.top { display: flex; align-items: center; gap: 0.75rem; min-height: 2.6rem; padding-right: 6.5rem; opacity: 0; transition: opacity 1.2s; }
.top.on { opacity: 1; }
.clock { font-family: var(--type); font-size: 2rem; font-weight: 700; color: var(--alert); letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
.track { flex: 1; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #1a2a3d, #3c4a66 60%, #c98a5e 88%, #ffd9a0); position: relative; overflow: hidden; }
.track i { position: absolute; inset: 0; left: calc(var(--done, 0) * 100%); background: var(--wall); opacity: 0.84; }
.sun { font-family: var(--type); font-size: 0.8rem; color: var(--muted); white-space: nowrap; }

.mapbox { position: relative; width: 100%; max-width: min(100%, 58dvh); margin-inline: auto; aspect-ratio: 1; transition: max-width 0.9s ease; }
.ended .mapbox { max-width: min(48%, 22dvh); }
#map { display: block; width: 100%; height: 100%; }
#map text { font-family: var(--type); text-anchor: middle; }
.terrain { opacity: 0; filter: brightness(calc(1 + var(--dawn, 0) * 0.8)) saturate(calc(0.85 + var(--dawn, 0) * 0.5)); transition: opacity 1.4s, filter 3s linear; }
.drawn .terrain { opacity: 1; }
.field { fill: var(--field); }
.rise { fill: url(#rise); }
.woods rect { fill: var(--woods); }
.leaves circle { fill: var(--leaf); fill-opacity: 0.75; }
.contour, .stream, .stream-glow, .road { fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; }
.drawn .contour, .drawn .stream, .drawn .stream-glow, .drawn .road { stroke-dashoffset: 0; transition: stroke-dashoffset 2.6s ease; }
.contour { stroke: var(--contour); stroke-opacity: 0.55; stroke-width: 0.03; }
.stream { stroke: var(--water); stroke-width: 0.3; stroke-linecap: round; }
.stream-glow { stroke: var(--water-light); stroke-opacity: 0.16; stroke-width: 0.62; stroke-linecap: round; }
.road { stroke: var(--road); stroke-width: 0.1; stroke-opacity: 0.8; }
.sky { fill: url(#sky); opacity: calc(var(--dawn, 0) * 0.22); mix-blend-mode: screen; transition: opacity 3s linear; pointer-events: none; }
.objective { fill: none; stroke: var(--alert); stroke-width: 0.05; stroke-dasharray: 0.16 0.12; opacity: 0; transition: opacity 1s 2s; }
.spot { opacity: 0; transition: opacity 1s 2s; }
.spot path { fill: var(--alert); }
.spot text { fill: var(--alert); font-size: 0.4px; font-weight: 700; }
.drawn .objective, .drawn .spot { opacity: 0.9; }
.objective.empty { stroke: #fff; stroke-width: 0.09; opacity: 1; }

.route { fill: none; stroke: var(--blue); stroke-width: 0.09; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0.75; }
.route.on { stroke-dashoffset: 0; transition: stroke-dashoffset 1.8s ease; }
.route.off { opacity: 0; transition: opacity 1s; }
.unit { opacity: 0; transition: opacity 0.5s; }
.unit.on { opacity: 1; }
.unit .body { stroke-width: 0.07; }
.unit.blue .body { fill: #0d2536; stroke: var(--blue); }
.unit.red .body { fill: #3a1512; stroke: var(--red); }
.unit text { font-family: var(--sans); font-weight: 700; font-size: 0.44px; }
.unit.blue text { fill: var(--blue); }
.unit.red text { fill: var(--red); font-size: 0.34px; }
.unit.pinned .body { stroke-dasharray: 0.12 0.08; }
.unit.ghost { opacity: 0.5; }
.unit.ghost .body { fill: none; stroke-dasharray: 0.06 0.1; }
.unit .dug { fill: none; stroke: var(--contour); stroke-width: 0.07; }
.smudge { opacity: 0; transition: opacity 0.8s; }
.smudge.on { opacity: 1; }
.smudge circle { fill: rgb(255 106 92 / 0.18); stroke: var(--red); stroke-width: 0.04; stroke-dasharray: 0.1 0.1; }
.smudge text { fill: var(--red); font-size: 0.7px; font-weight: 700; }
.glow { fill: url(#flare-glow); opacity: 0; transition: opacity 1.6s ease-out; }
.glow.on { opacity: 1; transition: opacity 0.12s; }
.tracer { stroke: #ffe9a8; stroke-width: 0.07; stroke-linecap: round; stroke-dasharray: 0.3 0.2; opacity: 0; }
.tracer.on { animation: shot 0.7s ease-out forwards; }
@keyframes shot { from { opacity: 1; } to { opacity: 0; } }

.flash { position: absolute; inset: -1rem; background: radial-gradient(circle at 58% 52%, #fff3c4, #ffd27a 40%, transparent 75%); opacity: 0; pointer-events: none; transition: opacity 1.8s ease-out; }
.flash.on { opacity: 0.85; transition: opacity 0.1s; }

.radio { display: flex; flex-direction: column; justify-content: flex-start; gap: 0.5rem; min-height: 9rem; }
.said { margin: 0; font-family: var(--type); font-size: 1.05rem; line-height: 1.35; color: var(--ink); border-left: 3px solid var(--alert); padding-left: 0.7rem; animation: in 0.4s ease both; }
.said.old { opacity: 0.38; transition: opacity 0.8s; }
.said b { color: var(--alert); font-weight: 700; letter-spacing: 0.08em; font-size: 0.8rem; display: block; }
.note { margin: 0; font-family: var(--serif); font-size: 1.25rem; font-style: italic; color: #fff; animation: in 0.6s ease both; text-wrap: balance; }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.gate, .end { animation: in 0.8s ease both; }
.gate { position: absolute; inset: 0; z-index: 3; display: grid; grid-template-columns: minmax(0, 1fr); align-content: center; gap: 0.9rem; text-align: center; padding: 1.5rem; background: var(--wall); }
.kicker { margin: 0; font-family: var(--type); color: var(--alert); letter-spacing: 0.2em; font-size: 0.85rem; text-transform: uppercase; }
h1 { margin: 0; font-family: var(--serif); font-size: clamp(3rem, 17vw, 5rem); line-height: 1; letter-spacing: 0.02em; }
.gate p, .end p { margin: 0; }
.muted { color: var(--muted); }
.go { justify-self: center; min-height: 48px; padding: 0.8rem 1.6rem; border: 0; border-radius: 6px; background: var(--alert); color: #111; font-weight: 700; font-size: 1.05rem; }
.end { display: grid; gap: 0.7rem; }
.end h1 { font-size: clamp(2.6rem, 14vw, 4rem); }
.tag { font-family: var(--serif); font-style: italic; font-size: 1.15rem; color: var(--ink); }
.facts { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.3rem; color: var(--muted); font-size: 0.95rem; }
.facts b { color: var(--ink); }
.ask { font-family: var(--type); font-size: 1.15rem; color: var(--alert); margin-top: 0.3rem !important; }
.choices { display: grid; gap: 0.5rem; }
.choices button { text-align: left; min-height: 48px; padding: 0.65rem 0.9rem; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
.choices button b { display: block; }
.choices button span { color: var(--muted); font-size: 0.88rem; }
.choices button[aria-pressed="true"] { border-color: var(--blue); }
.answer { font-family: var(--type); min-height: 3.2em; color: var(--ink); }
.again { justify-self: start; min-height: 44px; padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); }

.sound { position: fixed; z-index: 5; top: max(0.75rem, env(safe-area-inset-top, 0px)); right: max(0.75rem, env(safe-area-inset-right, 0px)); min-height: 36px; padding: 0.3rem 0.8rem; border-radius: 999px; border: 1px solid var(--line); background: rgb(5 9 13 / 0.8); color: var(--muted); font-size: 0.8rem; }
.sound[aria-pressed="true"] { color: #6cb788; border-color: #6cb788; }

@media (prefers-reduced-motion: reduce) {
  .said, .note, .gate, .end { animation: none; }
  .flash.on { opacity: 0.25; }
  .drawn .contour, .drawn .stream, .drawn .stream-glow, .drawn .road, .route.on { transition: none; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="top" id="top"><span class="clock" id="clock">02:00</span><span class="track" id="track"><i></i></span><span class="sun">☼ 06:00</span></div>
  <div class="mapbox"><svg id="map" viewBox="-0.3 -0.3 16.6 16.6" role="img" aria-label="A night map: a low hill north of a stream, woods on three sides"></svg><div class="flash" id="flash" aria-hidden="true"></div></div>
  <div class="radio" id="radio" aria-live="polite"></div>
</div>
<button type="button" class="sound" id="sound" aria-pressed="false">Tap for sound</button>

    tracer([13.3, 5.5], [14.2, 7], 3);

        <button type="button" aria-pressed="false" data-a="Bold. Open ground, and a machine gun you have not found yet."><b>Straight at it</b><span>The shortest way to the crest.</span></button>
