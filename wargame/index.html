<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Do You Want to Play a Game?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<style>
/* Layout: one old terminal screen, full bleed, text top-left; the reel takes the whole glass. Palette and type from Game Night's "The Terminal" theme. */
:root{
  color-scheme:dark;
  --ink:#a8ecff; --dim:#62b4d0; --ground:#010810; --glass:#07283a; --glow:rgb(110 220 255 / .55);
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,"DejaVu Sans Mono","Courier New",monospace;
}
html,body{height:100%}
body{
  margin:0;background:radial-gradient(ellipse at 50% 40%,var(--glass) 0%,#021019 55%,var(--ground) 100%) fixed var(--ground);
  color:var(--ink);font-family:var(--mono);font-size:clamp(16px,4.4vw,26px);line-height:1.5;
  text-transform:uppercase;letter-spacing:.06em;text-shadow:0 0 .5em var(--glow);
  padding-block:clamp(24px,7vh,72px) 96px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;overflow-x:hidden;
}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:10;
  background:repeating-linear-gradient(to bottom,transparent 0 2px,rgb(0 0 0 / .3) 2px 4px)}
#screen{max-width:40ch;margin:0 auto;display:flex;flex-direction:column;gap:.5em}
#screen p,#reel p{margin:0;min-height:1.5em;overflow-wrap:anywhere}
.gap{margin-top:.9em!important}
.dim{color:var(--dim)}
.typing::after,.caret::after{content:"\2588";margin-inline-start:.12em}
@media (prefers-reduced-motion:no-preference){.caret::after{animation:blink 1s steps(1) infinite}}
@keyframes blink{50%{opacity:0}}

button{font:inherit;text-transform:inherit;letter-spacing:inherit;text-shadow:inherit;color:var(--ink);
  background:transparent;border:0;border-radius:0;cursor:pointer;padding:.15em .4em;margin:0;text-align:left}
button:is(:hover,:focus-visible):not(:disabled){background:var(--ink);color:var(--ground);text-shadow:none}
:is(button,textarea):focus-visible{outline:3px solid #fff;outline-offset:3px}
button:disabled{cursor:default;color:var(--dim);opacity:.45}

.menu{list-style:none;margin:.4em 0 0;padding:0;display:flex;flex-direction:column;gap:.2em}
.menu button{width:100%;display:flex;gap:.6em;padding:.25em .4em;min-height:44px;align-items:center}
.menu .n{flex:none;width:1.6em}
.actions{display:flex;flex-wrap:wrap;gap:.6em;margin-top:.6em}
.actions button,.ctl{border:2px solid var(--ink);padding:.3em .8em;min-height:44px;
  box-shadow:0 0 .8em rgb(110 220 255 / .25),inset 0 0 .8em rgb(110 220 255 / .12)}
.actions button.minor{border-color:var(--dim);color:var(--dim);box-shadow:none}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:min(100%,12em);aspect-ratio:1;margin:.4em 0}
.board button{display:grid;place-items:center;font-size:1.6em;text-align:center;padding:0;border:0 solid var(--dim);aspect-ratio:1}
.board button:nth-child(-n+6){border-bottom-width:2px}
.board button:not(:nth-child(3n)){border-right-width:2px}
.board button.won{background:var(--ink);color:var(--ground);text-shadow:none}
.board button:disabled{opacity:1;color:var(--ink)}

.gallows{margin:.2em 0;font-size:.9em;line-height:1.15;white-space:pre;text-transform:none}
.word{font-size:1.25em;letter-spacing:.35em}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(2.1em,1fr));gap:.25em;max-width:100%}
.keys button{text-align:center;border:1px solid var(--dim);min-height:44px;padding:0}

/* The reel: a canvas under the glass, words laid over it. */
#reel{position:fixed;inset:0;z-index:5;background:var(--ground);overflow:hidden}
#reel canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#reel .cap{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;justify-content:space-between;gap:1em;font-size:.62em;color:var(--dim);font-variant-numeric:tabular-nums}
#reel .cap b{font-weight:400;color:var(--ink)}
#reel .mid{position:absolute;top:50%;transform:translateY(-50%);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:.5em;text-align:center}
#reel .mid p{max-width:30ch;text-wrap:balance}
#reel .mid .loud{font-size:1.35em}
#reel .title{font-size:clamp(34px,10vw,88px);letter-spacing:.2em;line-height:1.1;margin-inline-end:-.2em}
@media (prefers-reduced-motion:no-preference){#reel .title{animation:resolve 2.4s cubic-bezier(.2,.7,.2,1) both}}
@keyframes resolve{from{opacity:0;letter-spacing:.9em;filter:blur(8px)}to{opacity:1;letter-spacing:.2em;filter:blur(0)}}
#reel .low{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 76px);
  left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  max-width:40ch;margin:0 auto;display:flex;flex-direction:column;gap:.45em;
  padding:.8em 1em;background:linear-gradient(to bottom,rgb(1 8 16 / .55),rgb(1 8 16 / .85))}
#reel .low:empty{display:none}
#reel textarea{font:inherit;text-transform:uppercase;letter-spacing:inherit;color:var(--ink);text-shadow:inherit;
  background:rgb(1 8 16 / .6);border:2px solid var(--dim);border-radius:0;padding:.4em .5em;width:100%;box-sizing:border-box;
  resize:none;caret-color:var(--ink);min-height:4.6em}
#reel form{display:flex;flex-direction:column;gap:.5em;margin:0}
#reel form .actions{margin-top:0}

.dock{position:fixed;z-index:12;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);font-size:.62em;background:rgb(1 8 16 / .7)}
#sound{left:max(16px,env(safe-area-inset-left,0px))}
#skip{right:max(16px,env(safe-area-inset-right,0px))}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
body.alarm{--ink:#ffb4a8;--dim:#e0796a;--glow:rgb(255 107 90 / .55);--glass:#3a0b07}
@media (prefers-reduced-motion:no-preference){body.flicker{animation:flicker .9s steps(2) 1}}
@keyframes flicker{0%{opacity:1}20%{opacity:.2}35%{opacity:1}50%{opacity:0}70%{opacity:.8}100%{opacity:1}}
</style>
</head>
<body>
<main id="screen"></main>
<div id="reel" hidden>
  <canvas id="board" aria-hidden="true"></canvas>
  <div class="cap"><span id="capL"></span><span id="capR"></span></div>
  <div class="mid" id="mid"></div>
  <div class="low" id="low"></div>
</div>
<button id="sound" class="ctl dock" type="button" aria-pressed="true">Sound on</button>
<button id="skip" class="ctl dock" type="button" hidden>Skip</button>
<div id="say" class="sr" aria-live="polite"></div>

<script>
const NAME = "Commander";
const who = (decodeURIComponent(location.hash.slice(1)).trim() || NAME).toUpperCase();

const screen = document.getElementById('screen');
const say = document.getElementById('say');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SLOW = 1.12;
let hurry = false, typingNow = false, onKey = null, scene = 0;

/* ---------- Sound: made on the spot, no files ---------- */
let ac = null, out = null, noiseBuf = null, muted = false;
/* Phones open sound only on a finished tap (finger lifted), never on touch-down. On an iPhone, asking to be
   treated as media playback lets the sound play when the ringer switch is on silent. */
function audio() {
  try {
    if (!ac) {
      const C = window.AudioContext || window.webkitAudioContext;
      if (!C) return null;
      try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch {}
      ac = new C();
      ac.onstatechange = syncSound;
      const comp = ac.createDynamicsCompressor();
      out = ac.createGain(); out.gain.value = muted ? 0 : 0.9;
      out.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (ac.state !== 'running') {
      const p = ac.resume();
      if (p) p.then(syncSound, () => {});
      const s = ac.createBufferSource();
      s.buffer = ac.createBuffer(1, 1, 22050);
      s.connect(ac.destination); s.start(0);
    }
  } catch { return null; }
  keepMedia();
  syncSound();
  return ac;
}

/* A silent track played as media on the first tap. Without it an iPhone treats the page's sound as ringer
   sound and mutes it when the phone is on silent. */
let media = null;
function keepMedia() {
  try {
    if (!media) {
      const n = 4410, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
      const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
      w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
      v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
      v.setUint32(24, 44100, true); v.setUint32(28, 88200, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
      w(36, 'data'); v.setUint32(40, n * 2, true);
      media = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
      media.loop = true;
      media.setAttribute('playsinline', '');
    }
    if (media.paused) { const p = media.play(); if (p) p.catch(() => {}); }
  } catch {}
}
const live = () => ac && ac.state === 'running' && !muted;
function env(g, t, a, peak, hold, rel) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.setValueAtTime(peak, t + a + hold);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + hold + rel);
}
function noise(t, dur) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(t); s.stop(t + dur); return s; }
function tone(type, f, t, dur) { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.start(t); o.stop(t + dur); return o; }
function chain(...nodes) { for (let i = 0; i < nodes.length - 1; i++) nodes[i].connect(nodes[i + 1]); return nodes[0]; }
function filter(type, f, q = 1) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; return b; }
function gain() { return ac.createGain(); }

function tick() {
  if (!live()) return;
  const t = ac.currentTime, g = gain();
  env(g, t, 0.002, 0.11, 0.004, 0.03);
  chain(noise(t, 0.04), filter('bandpass', 1700 + Math.random() * 900, 5), g, out);
}
function klaxon(n = 3) {
  if (!live()) return;
  const t0 = ac.currentTime + 0.05;
  for (let i = 0; i < n; i++) {
    const t = t0 + i * 1.05, g = gain(), lp = filter('lowpass', 2400);
    env(g, t, 0.03, 0.34, 0.66, 0.14);
    chain(lp, g, out);
    for (const [type, m] of [['sawtooth', 1], ['square', 1.007], ['sawtooth', 0.5]]) {
      const o = tone(type, 410 * m, t, 0.95);
      o.frequency.linearRampToValueAtTime(660 * m, t + 0.58);
      o.frequency.linearRampToValueAtTime(615 * m, t + 0.8);
      o.connect(lp);
    }
  }
}
function beep(f = 880, d = 0.09, v = 0.16) {
  if (!live()) return;
  const t = ac.currentTime, g = gain();
  env(g, t, 0.004, v, d, 0.05);
  chain(tone('square', f, t, d + 0.1), filter('lowpass', 3000), g, out);
}
function blip() {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), o = tone('sine', 260, t, 0.3);
  o.frequency.exponentialRampToValueAtTime(1100, t + 0.22);
  env(g, t, 0.01, 0.06, 0.12, 0.12);
  chain(o, g, out);
}
function thump() {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), o = tone('sine', 110, t, 0.5);
  o.frequency.exponentialRampToValueAtTime(38, t + 0.35);
  env(g, t, 0.005, 0.22, 0.05, 0.35);
  chain(o, g, out);
}
let droneStop = null;
function drone(seconds) {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), lp = filter('lowpass', 140, 6);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.3, t + seconds);
  lp.frequency.exponentialRampToValueAtTime(900, t + seconds);
  chain(lp, g, out);
  const srcs = [tone('sawtooth', 55, t, seconds + 5), tone('sawtooth', 55.6, t, seconds + 5), tone('sawtooth', 82.4, t, seconds + 5)];
  const n = noise(t, seconds + 5), ng = gain(); ng.gain.value = 0.35;
  srcs.forEach(s => s.connect(lp)); chain(n, ng, lp);
  droneStop = () => { const now = ac.currentTime; g.gain.cancelScheduledValues(now); g.gain.setValueAtTime(0.0001, now); [...srcs, n].forEach(s => { try { s.stop(now + 0.02); } catch {} }); droneStop = null; };
}
function boom() {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), o = tone('sine', 72, t, 2.4), ng = gain();
  o.frequency.exponentialRampToValueAtTime(26, t + 1.6);
  env(g, t, 0.01, 0.55, 0.1, 1.9);
  ng.gain.value = 0.5;
  chain(o, g, out); chain(noise(t, 2), filter('lowpass', 160), ng, g);
}
function whoosh(d = 2.4) {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), bp = filter('bandpass', 250, 1.4);
  bp.frequency.exponentialRampToValueAtTime(3800, t + d * 0.7);
  bp.frequency.exponentialRampToValueAtTime(700, t + d);
  env(g, t, d * 0.6, 0.32, 0.05, d * 0.4);
  chain(noise(t, d + 0.2), bp, g, out);
}
function ping(f = 1320) {
  if (!live()) return;
  const t = ac.currentTime, g = gain();
  env(g, t, 0.004, 0.13, 0.02, 0.9);
  chain(tone('sine', f, t, 1.1), g, out);
  const g2 = gain(); env(g2, t, 0.004, 0.04, 0.02, 0.5); chain(tone('sine', f * 2.01, t, 0.7), g2, out);
}
function swell() {
  if (!live()) return;
  const t = ac.currentTime, g = gain(), lp = filter('lowpass', 500);
  lp.frequency.linearRampToValueAtTime(2200, t + 3);
  env(g, t, 1.8, 0.26, 2.6, 3.2);
  chain(lp, g, out);
  for (const f of [73.42, 146.83, 220, 293.66, 440, 659.25]) {
    for (const dt of [-1.5, 1.5]) { const o = tone(f < 100 ? 'sawtooth' : 'triangle', f, t, 8); o.detune.value = dt * 4; o.connect(lp); }
  }
}

const soundBtn = document.getElementById('sound');
function syncSound() {
  const on = ac && ac.state === 'running';
  soundBtn.textContent = muted ? 'Sound off' : on ? 'Sound on' : 'Tap for sound';
  soundBtn.setAttribute('aria-pressed', String(!muted && !!on));
}
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  if (ac && ac.state === 'running') muted = !muted; else muted = false;
  if (out) out.gain.value = muted ? 0 : 0.9;
  audio();
  if (!muted) beep(990, 0.06, 0.12);
});
syncSound();

for (const ev of ['pointerup', 'touchend', 'click']) document.addEventListener(ev, () => audio(), { passive: true });
document.addEventListener('pointerdown', () => { if (typingNow && !R.on) hurry = true; });
document.addEventListener('keydown', e => {
  audio();
  if (e.target.tagName === 'TEXTAREA') return;
  if (typingNow && !R.on && (e.key === 'Enter' || e.key === ' ')) { hurry = true; e.preventDefault(); return; }
  if (onKey && !e.metaKey && !e.ctrlKey && !e.altKey) onKey(e);
});

/* ---------- Typing ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const wait = ms => (hurry || reduce) ? Promise.resolve() : sleep(ms);

async function type(el, text, cps = 16) {
  const mine = scene;
  typingNow = true; el.classList.add('typing'); el.textContent = '';
  for (const ch of text) {
    if (mine !== scene) return;
    if (hurry || reduce) { el.textContent = text; break; }
    el.textContent += ch;
    if (ch !== ' ') tick();
    await sleep((ch === ' ' ? 600 : 1000) * SLOW / cps);
  }
  el.classList.remove('typing'); typingNow = false;
  say.textContent = text;
}

function line(cls = '', into = screen) {
  const p = document.createElement('p');
  if (cls) p.className = cls;
  into.append(p);
  return p;
}

async function show(text, { cls = '', cps = 16, pause = 250, into = screen } = {}) {
  const p = line(cls, into);
  await type(p, text, cps);
  await wait(pause);
  return p;
}

function newScene() {
  scene++; hurry = false; typingNow = false; onKey = null;
  screen.replaceChildren();
  return scene;
}

function actions(list, into = screen) {
  const box = document.createElement('div');
  box.className = 'actions';
  for (const [label, fn, minor] of list) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    if (minor) b.className = 'minor';
    b.addEventListener('click', fn);
    box.append(b);
  }
  into.append(box);
  box.querySelector('button').focus({ preventScroll: true });
  return box;
}

const GAMES = [
  { title: 'Tic-Tac-Toe', play: ticTacToe },
  { title: 'Hangman', play: hangman },
  { title: 'Chess', play: chess },
  { title: 'Poker', play: poker },
  { title: 'Thermonuclear War', play: war },
];

async function intro() {
  const me = newScene();
  await wait(800);
  await show(`Welcome, ${who}.`, { cps: 11, pause: 1100 });
  if (me !== scene) return;
  await show('Do you want to play a game?', { cps: 11, pause: 700 });
  if (me !== scene) return;
  await menu(me);
}

async function menu(me = newScene()) {
  if (!screen.children.length) await show('Do you want to play a game?', { cps: 30, pause: 200 });
  const ol = document.createElement('ol');
  ol.className = 'menu gap';
  screen.append(ol);
  for (const [i, g] of GAMES.entries()) {
    if (me !== scene) return;
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.type = 'button';
    b.innerHTML = `<span class="n">${i + 1}.</span><span class="t"></span>`;
    b.setAttribute('aria-label', g.title);
    b.addEventListener('click', () => g.play());
    li.append(b); ol.append(li);
    await type(b.querySelector('.t'), g.title, 26);
    await wait(i === GAMES.length - 2 ? 900 : 180);
  }
  if (me !== scene) return;
  const hint = await show('Select a game.', { cls: 'dim gap', cps: 20, pause: 0 });
  hint.classList.add('caret');
  onKey = e => { const n = Number(e.key); if (n >= 1 && n <= GAMES.length) GAMES[n - 1].play(); };
}

/* ---------- Tic-tac-toe: the computer never loses ---------- */
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let draws = 0;
function outcome(b) {
  for (const l of LINES) if (b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]) return { mark: b[l[0]], line: l };
  return b.every(Boolean) ? { mark: 'draw' } : null;
}
function score(b, oTurn, depth) {
  const w = outcome(b);
  if (w) return w.mark === 'O' ? 10 - depth : w.mark === 'X' ? depth - 10 : 0;
  let best = oTurn ? -Infinity : Infinity;
  for (let i = 0; i < 9; i++) if (!b[i]) {
    b[i] = oTurn ? 'O' : 'X';
    const s = score(b, !oTurn, depth + 1);
    b[i] = '';
    best = oTurn ? Math.max(best, s) : Math.min(best, s);
  }
  return best;
}
function computerMove(b) {
  let best = -Infinity, moves = [];
  for (let i = 0; i < 9; i++) if (!b[i]) {
    b[i] = 'O'; const s = score(b, false, 0); b[i] = '';
    if (s > best) { best = s; moves = [i]; } else if (s === best) moves.push(i);
  }
  return moves[Math.floor(Math.random() * moves.length)];
}

async function ticTacToe() {
  const me = newScene();
  await show('Tic-Tac-Toe.', { cps: 20 });
  await show('You are X. You go first.', { cls: 'dim', cps: 24, pause: 0 });
  if (me !== scene) return;
  const b = Array(9).fill('');
  const grid = document.createElement('div');
  grid.className = 'board';
  const cells = b.map((_, i) => {
    const c = document.createElement('button');
    c.type = 'button';
    c.setAttribute('aria-label', `Row ${Math.floor(i / 3) + 1}, column ${i % 3 + 1}`);
    c.addEventListener('click', () => mine(i));
    grid.append(c);
    return c;
  });
  screen.append(grid);
  const status = line('caret');
  cells[4].focus({ preventScroll: true });
  let busy = false;
  const put = (i, m) => { b[i] = m; cells[i].textContent = m; cells[i].disabled = true; cells[i].setAttribute('aria-label', `${cells[i].getAttribute('aria-label')}, ${m}`); beep(m === 'X' ? 660 : 440, 0.05, 0.08); };
  async function finish(w) {
    cells.forEach(c => c.disabled = true);
    status.classList.remove('caret');
    if (w.line) w.line.forEach(i => cells[i].classList.add('won'));
    let text = 'A draw.';
    if (w.mark === 'O') text = 'I win.';
    if (w.mark === 'X') text = 'You win. That should not be possible.';
    if (w.mark === 'draw' && ++draws >= 3) text = 'A draw again. Nobody wins this one.';
    await type(status, text, 22);
    if (me !== scene) return;
    actions([['Play again', ticTacToe], ['List games', () => menu()]]);
  }
  async function mine(i) {
    if (busy || b[i]) return;
    busy = true;

/* ---------- Hangman: words from the war game ---------- */
const WORDS = [
  ['FLANK', 'The side of a formation. Hit it, not the front.'],
  ['RECON', 'Going to look before you go to fight.'],
  ['SALIENT', 'A bulge in the line, open on three sides.'],
  ['AMBUSH', 'An attack from hiding on an enemy who is moving.'],
  ['SUPPLY', 'Food, fuel and ammunition. Cut it and an army stops.'],
  ['UMPIRE', 'The one who sees both sides and decides what happened.'],
  ['CONVOY', 'Vehicles moving together under guard.'],
  ['SENTRY', 'A soldier on watch.'],
  ['BRIDGEHEAD', 'A foothold across a river, held so others can follow.'],
  ['WITHDRAW', 'Pulling back on purpose, in order.'],
  ['KRIEGSSPIEL', 'German for war game. Played since 1824.'],
];
function gallows(n) {
  const h = n > 0 ? 'O' : ' ', t = n > 1 ? '|' : ' ', la = n > 2 ? '/' : ' ', ra = n > 3 ? '\\' : ' ', ll = n > 4 ? '/' : ' ', rl = n > 5 ? '\\' : ' ';
  return `  +---+\n  |   |\n  ${h}   |\n ${la}${t}${ra}  |\n ${ll} ${rl}  |\n      |\n=========`;
}
async function hangman() {
  const me = newScene();
  const [word, gloss] = WORDS[Math.floor(Math.random() * WORDS.length)];
  await show('Hangman.', { cps: 20 });
  await show(`${word.length} letters. Six misses and you hang.`, { cls: 'dim', cps: 24, pause: 0 });
  if (me !== scene) return;
  const art = document.createElement('pre');
  art.className = 'gallows'; art.setAttribute('aria-hidden', 'true');
  const shown = line('word');
  const status = line('dim');
  const keys = document.createElement('div');
  keys.className = 'keys';
  screen.insertBefore(art, shown); screen.append(keys);
  const got = new Set(); let misses = 0, over = false;
  const draw = () => {
    art.textContent = gallows(misses);
    shown.textContent = [...word].map(c => got.has(c) ? c : '_').join('');
    shown.setAttribute('aria-label', [...word].map(c => got.has(c) ? c : 'blank').join(' '));
    status.textContent = misses ? `Misses: ${misses} of 6` : '';
  };
  async function guess(c) {
    const key = keys.querySelector(`[data-c="${c}"]`);
    if (over || !key || key.disabled) return;
    key.disabled = true;
    if (word.includes(c)) { got.add(c); beep(880, 0.05, 0.08); } else { misses++; beep(180, 0.12, 0.12); }
    draw();
    const won = [...word].every(ch => got.has(ch));
    if (!won && misses < 6) return;
    over = true; onKey = null;
    keys.remove();
    if (!won) { [...word].forEach(ch => got.add(ch)); draw(); }
    await show(won ? 'Correct.' : `Hanged. The word was ${word}.`, { cps: 22, pause: 200 });
    await show(gloss, { cls: 'dim', cps: 30, pause: 0 });
    if (me !== scene) return;
    actions([['Play again', hangman], ['List games', () => menu()]]);
  }
  for (const c of 'ABCDEFGHIJKLMNOPQRSTUVWXYZ') {
    const k = document.createElement('button');
    k.type = 'button';
    k.textContent = c; k.dataset.c = c;
    k.addEventListener('click', () => guess(c));
    keys.append(k);
  }
  draw();
  onKey = e => { const c = e.key.toUpperCase(); if (/^[A-Z]$/.test(c)) guess(c); };
}

let W = 0, H = 0, reelToken = 0, FONT = "monospace";

function size() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  R.hillShape = makeHill();
  FONT = getComputedStyle(document.body).fontFamily;
}
addEventListener('resize', () => { if (R.on) size(); });

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const smooth = (a, b, v) => { const u = clamp((v - a) / (b - a)); return u * u * (3 - 2 * u); };

function tween(key, to, ms, token) {
  const from = R[key];
  if (reduce || ms <= 0) { R[key] = to; return Promise.resolve(); }
  return new Promise(res => {
    const t0 = performance.now();
    const step = now => {
      if (token !== reelToken) return res();
      const u = clamp((now - t0) / ms);
      R[key] = from + (to - from) * ease(u);
      u < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}
const hold = (ms, token) => (reduce || token !== reelToken) ? Promise.resolve() : sleep(ms);

function makeHill() {
  const cx = W / 2, cy = H * 0.4, rb = Math.min(W * 0.28, H * 0.25);
  const K = 9, rings = [];
  for (let k = 0; k < K; k++) {
    const f = k / K, pts = [];
    const ox = cx + rb * 0.22 * f, oy = cy - rb * 0.12 * f;
    const r0 = rb * (1 - f * 0.9);
    for (let i = 0; i <= 120; i++) {
      const a = (i / 120) * Math.PI * 2;
      const r = r0 * (1 + 0.16 * Math.sin(2 * a + 0.6 + f) + 0.08 * Math.sin(3 * a + 2.1) + 0.05 * Math.sin(5 * a + 0.3 + 2 * f));
      pts.push([ox + Math.cos(a) * r * 1.25, oy + Math.sin(a) * r * 0.85]);
    }
    rings.push(pts);
  }
  return { cx, cy, rb, rings, peak: [cx + rb * 0.22 * (K - 1) / K, cy - rb * 0.12 * (K - 1) / K] };
}

function spawnArc() {
  let a, b, n = 0;
  do { a = CITIES[Math.floor(Math.random() * CITIES.length)]; b = CITIES[Math.floor(Math.random() * CITIES.length)]; n++; }
  while (Math.abs(a[0] - b[0]) < 50 && n < 20);
  const x0 = (a[0] + 180) * 2, y0 = (90 - a[1]) * 2, x1 = (b[0] + 180) * 2, y1 = (90 - b[1]) * 2;
  const dist = Math.hypot(x1 - x0, y1 - y0);
  R.arcs.push({ x0, y0, x1, y1, cx: (x0 + x1) / 2, cy: Math.min(y0, y1) - dist * 0.32, t0: R.now, dur: 2 + Math.random() * 1.4, hit: false });
  blip();
}

function frame(now) {
  if (!R.on) return;
  requestAnimationFrame(frame);
  if (!R.frozen) R.now = now / 1000;
  draw();
}

function draw() {
  const c = R.c;
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const tall = H > W, fit = Math.min(W / 720, H / 280) * 0.96;
  const e = R.zoom, s = tall ? Math.max(fit, W / 420) : fit, z = Math.pow(46, e), x0 = tall ? 380 : 360;
  const cx = x0 + (TARGET[0] - x0) * e, cy = 160 + (TARGET[1] - 160) * e;
  const P = (x, y) => [W / 2 + (x - cx) * s * z, H / 2 + (y - cy) * s * z];
  const mapA = 1 - smooth(0.35, 0.85, e);

  if (mapA > 0.01 && R.map > 0) {
    ctx.save();
    ctx.globalAlpha = mapA;
    const sweep = P(R.map * 720, 0)[0];
    ctx.beginPath(); ctx.rect(0, 0, sweep, H); ctx.clip();
    ctx.strokeStyle = c.grid; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x <= 720; x += 60) { const [a, b] = [P(x, 20), P(x, 300)]; ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
    for (let y = 60; y <= 300; y += 60) { const [a, b] = [P(0, y), P(720, y)]; ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); }
    ctx.stroke();
    ctx.strokeStyle = c.ink; ctx.lineWidth = 1.1; ctx.shadowColor = c.glow; ctx.shadowBlur = 8;
    ctx.beginPath();
    for (const ring of LAND) {
      let [x, y] = P(ring[0], ring[1]); ctx.moveTo(x, y);
      for (let i = 2; i < ring.length; i += 2) {
        const jump = Math.abs(ring[i] - ring[i - 2]) > 300;
        [x, y] = P(ring[i], ring[i + 1]);
        jump ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
    }
    ctx.stroke();
    ctx.restore();
    if (R.map < 1) {
      ctx.save(); ctx.globalAlpha = mapA * 0.8; ctx.strokeStyle = c.ink; ctx.shadowColor = c.glow; ctx.shadowBlur = 16; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sweep, 0); ctx.lineTo(sweep, H); ctx.stroke(); ctx.restore();
    }
    drawArcs(P, mapA);
  }
  if (R.hill > 0) drawHill(smooth(0.55, 1, e));
  if (R.dim > 0) { ctx.fillStyle = `rgba(1,8,16,${R.dim})`; ctx.fillRect(0, 0, W, H); }
}

function drawArcs(P, mapA) {
  const c = R.c;
  ctx.save();
  ctx.shadowColor = c.glow; ctx.shadowBlur = 10;
  for (const a of R.arcs) {
    const p = clamp((R.now - a.t0) / a.dur);
    if (p <= 0) continue;
    const at = u => P((1 - u) * (1 - u) * a.x0 + 2 * (1 - u) * u * a.cx + u * u * a.x1, (1 - u) * (1 - u) * a.y0 + 2 * (1 - u) * u * a.cy + u * u * a.y1);
    const path = (u0, u1, n) => { ctx.beginPath(); for (let i = 0; i <= n; i++) { const [x, y] = at(u0 + (u1 - u0) * i / n); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); };
    ctx.globalAlpha = mapA * R.arcA * 0.3; ctx.strokeStyle = c.dim; ctx.lineWidth = 1; path(0, p, 24);
    ctx.globalAlpha = mapA * R.arcA; ctx.strokeStyle = c.ink; ctx.lineWidth = 2; path(Math.max(0, p - 0.22), p, 10);
    if (p < 1) {
      const [x, y] = at(p); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 2.4, 0, Math.PI * 2); ctx.fill();
    } else {
      if (!a.hit) { a.hit = true; thump(); }
      const age = R.now - (a.t0 + a.dur);
      const [x, y] = at(1);
      ctx.strokeStyle = c.ink; ctx.lineWidth = 1.5;
      ctx.globalAlpha = mapA * R.arcA * Math.max(0.25, 1 - age / 1.4);
      ctx.beginPath(); ctx.arc(x, y, age < 1.4 ? 3 + age * 16 : 3, 0, Math.PI * 2); ctx.stroke();
    }
  }
  ctx.restore();
}

function symbol(x, y, kind, a) {
  ctx.save();
  ctx.globalAlpha = a;
  const col = kind === 'friend' ? FRIEND : HOSTILE;
  ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.shadowColor = col; ctx.shadowBlur = 12;
  ctx.fillStyle = 'rgba(1,8,16,.75)';
  ctx.beginPath();
  if (kind === 'friend') { ctx.rect(x - 18, y - 12, 36, 24); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 18, y - 12); ctx.lineTo(x + 18, y + 12); ctx.moveTo(x + 18, y - 12); ctx.lineTo(x - 18, y + 12); }
  else { ctx.moveTo(x, y - 17); ctx.lineTo(x + 17, y); ctx.lineTo(x, y + 17); ctx.lineTo(x - 17, y); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.moveTo(x - 8.5, y - 8.5); ctx.lineTo(x + 8.5, y + 8.5); ctx.moveTo(x + 8.5, y - 8.5); ctx.lineTo(x - 8.5, y + 8.5); }
  ctx.stroke();
  ctx.shadowBlur = 0; ctx.fillStyle = col; ctx.font = `12px ${FONT}`; ctx.textAlign = 'center';
  ctx.fillText(kind === 'friend' ? 'BLUE' : 'RED', x, y + (kind === 'friend' ? 30 : 33));
  ctx.restore();
}

function drawHill(fade) {
  const h = R.hillShape, c = COLORS.blue, K = h.rings.length;
  ctx.save();
  ctx.globalAlpha = fade;
  ctx.shadowColor = c.glow; ctx.shadowBlur = 6;
  const font = FONT;
  h.rings.forEach((pts, k) => {
    const f = clamp(R.hill * K - k);
    if (f <= 0) return;
    const index = k % 4 === 0;
    ctx.strokeStyle = index ? c.ink : c.dim; ctx.lineWidth = index ? 1.8 : 1;
    const n = Math.max(2, Math.round(pts.length * f));
    ctx.beginPath(); pts.slice(0, n).forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
    if (index && f === 1) {
      const [x, y] = pts[Math.round(pts.length * 0.12)];
      ctx.save(); ctx.shadowBlur = 0; ctx.fillStyle = c.dim; ctx.font = `11px ${font}`; ctx.fillText(String(60 + k * 10), x + 4, y); ctx.restore();
    }
  });
  if (R.hill >= 1) {
    const [px, py] = h.peak;
    ctx.fillStyle = c.ink; ctx.font = `11px ${font}`; ctx.fillText('▲ 142', px + 24, py - 16);
  }
  const u = R.units;
  if (u > 0) {
    const { cx, cy, rb } = h;
    ctx.globalAlpha = fade * clamp(u * 2);
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.moveTo(-10, cy + rb * 1.15); ctx.bezierCurveTo(W * 0.3, cy + rb * 0.85, W * 0.62, cy + rb * 1.25, W + 10, cy + rb * 0.75);
    ctx.strokeStyle = c.dim; ctx.lineWidth = 6; ctx.stroke(); ctx.strokeStyle = '#010810'; ctx.lineWidth = 3; ctx.stroke();
    ctx.strokeStyle = c.dim; ctx.lineWidth = 1;
    const wx = cx - rb * 1.15, wy = cy + rb * 0.25;
    for (const [dx, dy] of [[0,0],[14,-8],[-12,-10],[8,12],[-6,14],[22,6],[-20,4],[2,-20],[18,-22]]) { ctx.beginPath(); ctx.arc(wx + dx, wy + dy, 5, 0, Math.PI * 2); ctx.stroke(); }
    symbol(cx - rb * 0.5, cy + rb * 1.35, 'friend', fade * clamp(u * 2));
    symbol(h.peak[0], h.peak[1] + 2, 'hostile', fade * clamp(u * 2 - 1));
  }
  ctx.restore();
}

function setColors(red) {
  document.body.classList.toggle('alarm', red);
  R.c = red ? COLORS.red : COLORS.blue;
}

function stopReel() {
  reelToken++;
  R.on = false;
  if (droneStop) droneStop();
  reelEl.hidden = true; skipBtn.hidden = true;
  setColors(false);
  mid.replaceChildren(); low.replaceChildren(); capL.textContent = ''; capR.textContent = '';
}

function finalFrame() {
  Object.assign(R, { frozen: false, map: 1, arcA: 0, zoom: 1, hill: 1, units: 1, dim: 0.35 });
  setColors(false);
  capL.textContent = 'Sector 7 · 1:25 000'; capR.textContent = 'Hill 142';
}

async function reel() {
  const token = ++reelToken;
  const ok = () => token === reelToken;
  Object.assign(R, { on: true, frozen: false, map: 0, arcA: 1, zoom: 0, hill: 0, units: 0, dim: 0, arcs: [] });
  screen.replaceChildren(); mid.replaceChildren(); low.replaceChildren();
  reelEl.hidden = false; skipBtn.hidden = false;
  size();
  setColors(true);
  document.body.classList.add('flicker');
  setTimeout(() => document.body.classList.remove('flicker'), 900);
  requestAnimationFrame(frame);

  klaxon(3);
  capL.textContent = 'Alert'; capR.textContent = '';
  await show('Launch detected.', { cls: 'loud', cps: 14, pause: 0, into: mid });
  await hold(2200, token); if (!ok()) return;
  mid.replaceChildren();

  capL.innerHTML = 'Strategic display';
  await tween('map', 1, 2600, token); if (!ok()) return;

  drone(11);
  for (let i = 10; i >= 1; i--) {
    capR.innerHTML = `T-00:<b>${String(i).padStart(2, '0')}</b>`;
    beep(i <= 3 ? 1320 : 990, 0.07, 0.14);
    const n = Math.round((11 - i) * 0.9);
    for (let k = 0; k < n; k++) setTimeout(() => { if (ok() && !R.frozen) spawnArc(); }, (reduce ? 0 : 1000 / n) * k);
    await hold(1000, token); if (!ok()) return;
  }
  capR.innerHTML = 'T-00:<b>00</b>';
  R.frozen = true;
  R.arcs.forEach(a => { a.hit = true; });
  if (droneStop) droneStop();
  await hold(1300, token); if (!ok()) return;
  boom();
  await show('No side wins this one.', { cls: 'loud', cps: 13, pause: 1500, into: mid });
  if (!ok()) return;
  await show("Let's try a smaller war.", { cps: 14, pause: 900, into: mid });
  if (!ok()) return;
  mid.replaceChildren();
  await tween('arcA', 0, 900, token); if (!ok()) return;

  setColors(false);
  capL.textContent = 'Closing'; capR.textContent = '';
  whoosh(2.6);
  tween('hill', 1, 3400, token);
  await tween('zoom', 1, 2800, token); if (!ok()) return;
  capL.textContent = 'Sector 7 · 1:25 000'; capR.textContent = 'Hill 142';
  await hold(900, token); if (!ok()) return;
  ping(990);
  await tween('units', 0.5, 700, token); if (!ok()) return;
  ping(660);
  await tween('units', 1, 700, token); if (!ok()) return;
  await show('Red holds the hill.', { cps: 15, pause: 400, into: low });
  await show('Blue must take it before dark.', { cps: 15, pause: 1600, into: low });
  if (!ok()) return;
  low.replaceChildren();

  swell();
  await tween('dim', 0.72, 1200, token); if (!ok()) return;
  await show('A better game.', { cls: 'loud', cps: 12, pause: 900, into: mid });
  if (!ok()) return;
  mid.replaceChildren();
  const t = document.createElement('p'); t.className = 'title'; t.textContent = 'Kriegsspiel'; mid.append(t);
  say.textContent = 'Kriegsspiel';
  await hold(2500, token); if (!ok()) return;
  await show('A real war game. Built for you.', { cls: 'dim', cps: 16, pause: 1400, into: mid });
  if (!ok()) return;
  await show('You command Blue forces.', { cps: 14, pause: 2000, into: mid });
  if (!ok()) return;
  mid.replaceChildren();
  await tween('dim', 0.35, 900, token); if (!ok()) return;
  orders(token);
}

async function orders(token) {
  skipBtn.hidden = true;
  low.replaceChildren();
  await show('What are your orders?', { cps: 13, pause: 0, into: low });
  if (token !== reelToken) return;
  const form = document.createElement('form');
  form.innerHTML = '<label class="sr" for="order-text">Your orders</label><textarea id="order-text" rows="3" maxlength="400" placeholder="Type your orders"></textarea><div class="actions"><button type="submit">Transmit</button></div>';
  low.append(form);
  const box = form.querySelector('textarea');
  box.focus({ preventScroll: true });
  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!box.value.trim()) { box.focus(); return; }
    form.remove();
    beep(1320, 0.05, 0.1); setTimeout(() => beep(1760, 0.05, 0.1), 90);
    await show('Orders recorded.', { cps: 16, pause: 500, into: low });
    await show('Deliver them to your father in person.', { cls: 'dim', cps: 18, pause: 500, into: low });
    const last = await show('Stand by.', { cps: 14, pause: 0, into: low });
    last.classList.add('caret');
    if (token !== reelToken) return;
    actions([['Play again', () => { stopReel(); intro(); }], ['List games', () => { stopReel(); menu(); }, true]], low);
  });
}

skipBtn.addEventListener('click', e => {
  e.stopPropagation();
  const token = ++reelToken;
  if (droneStop) droneStop();
  mid.replaceChildren();
  finalFrame();
  orders(token);
});

intro();
</script>
</body>
</html>
